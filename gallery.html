<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资料</title>
    <link rel="stylesheet" href="gallery-style.css">
</head>
<body class="gallery-body">

    <!-- 顶部标题栏 -->
    <div class="top-bar">
        <span class="top-icon">‹</span>
        <span class="top-title">Memory</span>
        <div class="top-icons">
            <span>🔍</span>
            <span>＋</span>
        </div>
    </div>

    <!-- 中间大图卡片 -->
    <div class="hero-card">
       <img class="hero-img" src="https://pupywq.github.io/suyan/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20261012235903_333_2.jpg" alt="大图">
    </div>

    <!-- 文字信息 -->
    <p class="mem-count">3 memories</p >
    <div class="mem-nav">
        <span>‹</span>
        <span class="mem-name">资料展示</span>
        <span>›</span>
    </div>
    <div class="mem-dots">
        <span></span><span></span><span class="active"></span><span></span><span></span>
    </div>

    <!-- 导出导入 -->
    <div class="export-row">
        <span>↓ 导出</span>
        <span>↑ 导入</span>
    </div>

    <!-- 数据统计 -->
    <div class="stats-card">
        <div class="stat"><b>话术</b><span>SCRIPT</span></div>
        <div class="stat"><b>板评</b><span>REVIEW</span></div>
        <div class="stat"><b>卡面</b><span>CARD</span></div>
    </div>

    <!-- 标签 -->
    <div class="tabs">
        <span>关系</span>
        <span>背景</span>
        <span>剧情</span>
        <span>发展</span>
        <span class="active">♟ 纪念日</span>
    </div>

    <!-- 下方三个小组件 -->
    <div class="record-list">

        <!-- 小组件 1 -->
        <div class="record-card">
            <div class="record-date">
                <b>话术</b>
                <span>单内风格展示</span>
            </div>
            <div class="record-text">
                <p>这里是一句你想放的文案</p >
                <span class="record-sub">进度 5/21</span>
            </div>
            <div class="record-icons">🗑</div>
        </div>

        <!-- 小组件 2 -->
        <div class="record-card">
            <div class="record-date">
                <b>板评</b>
                <span>回忆与你有关</span>
            </div>
            <div class="record-text">
                <p>这里是一句你想放的文案</p >
                <span class="record-sub">进度 13/21</span>
            </div>
            <div class="record-icons">🗑</div>
        </div>

        <!-- 小组件 3 -->
        <div class="record-card">
            <div class="record-date">
                <b>卡面</b>
                <span>我存在的证明</span>
            </div>
            <div class="record-text">
                <p>这里是一句你想放的文案</p >
                <span class="record-sub">进度 19/21</span>
            </div>
            <div class="record-icons">🗑</div>
        </div>

    </div>

    <!-- 底部导航 -->
    <div class="nav">
        <a href="index.html" class="nav-item">主页</a >
        <a href="home.html" class="nav-item">须知</a >
        <a href="gallery.html" class="nav-item active">资料</a >
    </div>

</body>
</html>
