<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <!-- 顶部背景区 -->
        <div class="hero"></div>

        <!-- 头像 -->
        <div class="avatar-wrap">
            <img class="avatar" src="https://pupywq.github.io/suyan/F65D235A57576D2083A87CCB4C8DD806.jpg" alt="头像">
        </div>

        <!-- 文字信息区 -->
        <div class="profile">
            <h1 class="name">不知名</h1>
            <p class="handle">@pupywq-</p>
            <p class="signature">待在我身边就已经很幸福了不是吗</p>
            <p class="location">ip属地：余烬女团</p>
        </div>

        <!-- 下半部分：组件区 -->
        <div class="widgets">
            <h2 class="widget-title">Stay with me</h2>

            <div class="widget-grid">
                <!-- 左边四个方块 -->
                <div class="icon-grid">
                    <div class="icon-item">
                        <div class="icon-box" src="https://pupywq.github.io/suyan/%E5%9B%BE1.jpg" alt="图标">
                        <p>三恋</p>
                    </div>
                    <div class="icon-item">
                        <div class="icon-box" src="https://pupywq.github.io/suyan/%E5%9B%BE2.jpg" alt="图标">
                        <p>王娱</p>
                    </div>
                    <div class="icon-item">
                        <div class="icon-box" src="https://pupywq.github.io/suyan/%E5%9B%BE3.jpg" alt="图标">
                        <p>纯连</p>
                    </div>
                    <div class="icon-item">
                        <div class="icon-box" src="https://pupywq.github.io/suyan/%E5%9B%BE4.jpg" alt="图标">
                        <p>哄睡</p>
                    </div>
                </div>

                <!-- 右边大组件 -->
                <div class="big-widget">
                    <div class="widget-row">
                        <div class="widget-circle"></div>
                        <span>le-t</span>
                    </div>
                    <div class="widget-row">
                        <span>重力系</span>
                        <div class="widget-circle"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="nav">
            <a href="#" class="nav-item active">主页</a>
            <a href="#" class="nav-item">须知</a>
            <a href="#" class="nav-item">资料</a>
        </div>
    </div>
</body>
</html>
