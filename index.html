<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="card">
            <!-- 头像 -->
            <div class="avatar-wrap">
                <img class="avatar" src="https://pupywq.github.io/suyan/575-d-enhance-1.5x.png" alt="头像">
            </div>

            <!-- 名字与账号 -->
            <h1 class="name">你的名字</h1>
            <p class="handle">@your_id</p>

            <!-- 签名 -->
            <p class="bio">这里写一句你的签名或想说的话</p>

            <!-- 信息区 -->
            <div class="info-list">
                <div class="info-item">
                    <span class="info-label">IP 属地</span>
                    <span class="info-value">待填写</span>
                </div>
                <div class="info-item">
                    <span class="info-label">星座</span>
                    <span class="info-value">待填写</span>
                </div>
                <div class="info-item">
                    <span class="info-label">状态</span>
                    <span class="info-value">待填写</span>
                </div>
            </div>

            <!-- 底部导航 -->
            <div class="nav">
                <a href="#" class="nav-item active">名片</a>
                <a href="#" class="nav-item">介绍</a>
                <a href="#" class="nav-item">相册</a>
            </div>
        </div>
    </div>
</body>
</html>
